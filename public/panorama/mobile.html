<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" /> 
    <title>360度全景体验 - 移动端</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com; img-src 'self' data: https: https://cdn.cosmos.so; connect-src 'self' https:; frame-src 'self';">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style type="text/css">
        html {
            height: 100%;
            touch-action: pan-y; /* 只允许垂直滑动翻页 */
        }
        body {
            height: 100%;
            margin: 0px;
            overflow: hidden;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            background: #000;
        }
        #container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #gyro-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
            max-width: 200px;
            line-height: 1.4;
        }
        #debug-info {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border-radius: 5px;
            display: none;
            max-width: 150px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Loading...</div>
        <div id="gyro-info">
            <div>陀螺仪控制已启用</div>
            <div>请允许设备方向权限</div>
        </div>
        <div id="debug-info">
            <div>陀螺仪调试</div>
            <div>Beta: <span id="beta-value">0</span>°</div>
            <div>Tilt: <span id="tilt-value">0</span>°</div>
            <div style="font-size: 9px; margin-top: 4px; opacity: 0.8;">
                屏幕朝上→前方<br/>
                正视前方→地面<br/>
                倒置→天花板
            </div>
        </div>
    </div>

    <script type="text/javascript" src="pano2vr_player.js"></script>
    <script src="webxr/three.min.js"></script>
    <script src="webxr/webxr-polyfill.min.js"></script>
    
    <script type="text/javascript">
        let pano;
        let isGyroEnabled = false;
        let gyroData = { alpha: 0, beta: 0, gamma: 0 };
        let lastGyroData = { alpha: 0, beta: 0, gamma: 0 };
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // 创建全景播放器
        function initPano() {
            pano = new pano2vrPlayer("container");
            // 使用绝对路径加载XML配置，确保从正确的服务器加载
            var currentHost = window.location.protocol + "//" + window.location.host;
            var xmlPath = currentHost + "/panorama/pano.xml";
            console.log("Loading XML from:", xmlPath);
            pano.readConfigUrlAsync(xmlPath);
            
            // 移动端特殊配置
            if (isMobile) {
                // 启用陀螺仪控制
                setTimeout(() => {
                    // 调试：显示可用的方法
                    console.log("Pano2VR available methods:", Object.getOwnPropertyNames(pano));
                    initGyroscope();
                }, 2000); // 等待播放器完全加载
            }
        }

        // 初始化陀螺仪
        function initGyroscope() {
            if (typeof DeviceOrientationEvent !== 'undefined') {
                // 请求权限（iOS 13+）
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                enableGyroscope();
                            } else {
                                showGyroInfo('陀螺仪权限被拒绝');
                            }
                        })
                        .catch(console.error);
                } else {
                    enableGyroscope();
                }
            } else {
                showGyroInfo('设备不支持陀螺仪');
            }
        }

        // 启用陀螺仪
        function enableGyroscope() {
            isGyroEnabled = true;
            showGyroInfo('陀螺仪控制已启用');
            
            // 显示调试信息
            const debugInfo = document.getElementById('debug-info');
            if (debugInfo) {
                debugInfo.style.display = 'block';
            }
            
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        // 处理设备方向变化
        function handleOrientation(event) {
            if (!isGyroEnabled || !pano) return;

            gyroData.alpha = event.alpha || 0; // 绕Z轴旋转 (0-360)
            gyroData.beta = event.beta || 0;   // 绕X轴旋转 (-180到180)
            gyroData.gamma = event.gamma || 0; // 绕Y轴旋转 (-90到90)

            // 计算旋转增量
            let deltaAlpha = gyroData.alpha - lastGyroData.alpha;
            let deltaBeta = gyroData.beta - lastGyroData.beta;

            // 处理alpha的360度边界
            if (deltaAlpha > 180) deltaAlpha -= 360;
            if (deltaAlpha < -180) deltaAlpha += 360;

            // 应用旋转到全景图
            if (Math.abs(deltaAlpha) > 0.5 || Math.abs(deltaBeta) > 0.5) {
                try {
                    // 修正陀螺仪角度映射
                    let pan = gyroData.alpha; // 水平旋转保持不变
                    
                    // 重新修正垂直旋转映射逻辑：
                    // 手机屏幕朝上（beta接近90度）时，应该显示正前方（tilt = 0）
                    // 手机正视前方（beta接近0度）时，应该显示地面（tilt = -90）
                    // 手机倒置（beta接近-90度）时，应该显示天花板（tilt = 90）
                    // 这样模拟出手机屏幕朝向哪个方向，就显示该方向的前方画面
                    let tilt = 90 - gyroData.beta; // 重新计算映射关系
                    tilt = Math.max(-90, Math.min(90, tilt)); // 限制范围

                    // 更新调试信息显示
                    const betaValue = document.getElementById('beta-value');
                    const tiltValue = document.getElementById('tilt-value');
                    if (betaValue) betaValue.textContent = Math.round(gyroData.beta);
                    if (tiltValue) tiltValue.textContent = Math.round(tilt);

                    // 尝试不同的API方法
                    if (typeof pano.setPanTilt === 'function') {
                        pano.setPanTilt(pan, tilt);
                    } else if (typeof pano.setPan === 'function' && typeof pano.setTilt === 'function') {
                        pano.setPan(pan);
                        pano.setTilt(tilt);
                    } else if (typeof pano.setViewerSize === 'function') {
                        // 如果API不可用，至少确保播放器正常工作
                        console.log("Gyro data:", { pan, tilt, beta: gyroData.beta });
                    }
                } catch (e) {
                    console.log("Gyro control error:", e);
                }
            }

            // 更新上次数据
            lastGyroData = { ...gyroData };
        }

        // 显示陀螺仪信息
        function showGyroInfo(message) {
            const info = document.getElementById('gyro-info');
            if (info) {
                info.innerHTML = message;
                info.style.display = 'block';
                setTimeout(() => {
                    info.style.display = 'none';
                }, 3000);
            }
        }

        // 页面加载完成后初始化
        window.addEventListener("load", function() {
            initPano();
        });

        // 防止页面滚动
        document.addEventListener('touchmove', function(e) {
            // 只允许垂直滑动翻页，阻止水平滑动
            if (Math.abs(e.touches[0].clientX - e.touches[0].pageX) > 10) {
                e.preventDefault();
            }
        }, { passive: false });

        // 处理页面可见性变化
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // 页面隐藏时暂停陀螺仪
                isGyroEnabled = false;
            } else {
                // 页面显示时恢复陀螺仪
                if (isMobile) {
                    setTimeout(() => {
                        isGyroEnabled = true;
                    }, 100);
                }
            }
        });
    </script>
</body>
</html>
