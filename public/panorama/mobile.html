<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" /> 
    <title>360度全景体验 - 移动端</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com; img-src 'self' data: https: https://cdn.cosmos.so; connect-src 'self' https:; frame-src 'self';">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style type="text/css">
        html {
            height: 100%;
            touch-action: pan-y; /* 只允许垂直滑动翻页 */
        }
        body {
            height: 100%;
            margin: 0px;
            overflow: hidden;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            background: #000;
        }
        #container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #touch-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: block;
            max-width: 200px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Loading...</div>
        <div id="touch-info">
            <div>触摸控制已启用</div>
            <div style="font-size: 12px; margin-top: 4px;">
                双指滑动：控制全景图<br/>
                单指滑动：翻页操作
            </div>
        </div>
    </div>

    <script type="text/javascript" src="pano2vr_player.js"></script>
    <script src="webxr/three.min.js"></script>
    <script src="webxr/webxr-polyfill.min.js"></script>
    
    <script type="text/javascript">
        let pano;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let touchStartTime = 0;
        let touchStartY = 0;
        let isPanoramaTouch = false;

        // 创建全景播放器
        function initPano() {
            pano = new pano2vrPlayer("container");
            // 使用绝对路径加载XML配置，确保从正确的服务器加载
            var currentHost = window.location.protocol + "//" + window.location.host;
            var xmlPath = currentHost + "/panorama/pano.xml";
            console.log("Loading XML from:", xmlPath);
            pano.readConfigUrlAsync(xmlPath);
            
            // 移动端配置：保留自动旋转，启用触摸控制
            if (isMobile) {
                console.log("Mobile device detected, touch controls enabled");
            }
        }

        // 触摸控制函数
        function handleTouchStart(e) {
            touchStartTime = Date.now();
            touchStartY = e.touches[0].clientY;
            isPanoramaTouch = e.touches.length === 2; // 双指触摸
            
            if (e.touches.length === 1) {
                // 单指触摸，准备翻页
                e.preventDefault();
            } else if (e.touches.length === 2) {
                // 双指触摸，控制全景图
                e.preventDefault();
            }
        }

        function handleTouchMove(e) {
            if (e.touches.length === 2) {
                // 双指滑动控制全景图
                e.preventDefault();
                isPanoramaTouch = true;
            } else if (e.touches.length === 1 && !isPanoramaTouch) {
                // 单指滑动翻页
                e.preventDefault();
            }
        }

        function handleTouchEnd(e) {
            const touchDuration = Date.now() - touchStartTime;
            const touchDistance = Math.abs(e.changedTouches[0].clientY - touchStartY);
            
            if (e.touches.length === 0) {
                // 触摸结束
                if (touchDuration < 300 && touchDistance < 10 && !isPanoramaTouch) {
                    // 短时间轻触，可能是翻页操作
                    console.log("Page turn gesture detected");
                }
                isPanoramaTouch = false;
            }
        }

        // 页面加载完成后初始化
        window.addEventListener("load", function() {
            initPano();
        });

        // 移动端触摸控制
        if (isMobile) {
            document.addEventListener('touchstart', handleTouchStart, { passive: false });
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', handleTouchEnd, { passive: false });
        }

        // 处理页面可见性变化
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // 页面隐藏时暂停
                console.log("Page hidden");
            } else {
                // 页面显示时恢复
                console.log("Page visible");
            }
        });
    </script>
</body>
</html>
